name: web

on:
  push:
    branches:
      - feat/browser-first-spa
      - dev
      - master
    paths:
      - 'web/**'
      - 'scripts/**'
      - 'fixtures/**'
      - 'test-fixtures/**'
      - 'assets/**'
      - 'media/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/**'
      - 'fixtures/**'
      - 'test-fixtures/**'
      - 'assets/**'
      - 'media/**'
      - '.github/workflows/web.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Pillow for PyCharm icon conversion
        run: pip install Pillow

      - name: Sync static assets and command catalog
        run: |
          node scripts/sync-assets.mjs
          node scripts/export-catalog.mjs
          test -d web/public/icons/pycharm
          test -f web/public/programs.json
          test -f web/public/i/program-icons/PyCharm.png
          test -f web/public/defaults/pycharm-windows.xml
          test -f test-fixtures/Windows.xml

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Check layout CSS reached the bundle
        working-directory: web
        run: |
          css=$(find dist -name '*.css' | head -1)
          test -n "$css"
          grep -q 'keyboardGrid' "$css"
          grep -q 'minmax(0, 1fr)' "$css"
          grep -q 'chip-popover' "$css"
          if grep -q ':global(' "$css"; then
            echo 'bundled CSS must not contain :global()'
            exit 1
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/browser-first-spa' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
